name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "number=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Update app version in Xcode project
        run: |
          sed -i '' "s/MARKETING_VERSION = .*;/MARKETING_VERSION = ${{ steps.version.outputs.number }};/g" clip.xcodeproj/project.pbxproj

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add clip.xcodeproj/project.pbxproj
          git commit -m "Bump version to ${{ steps.version.outputs.number }}" || echo "No changes to commit"
          git push origin HEAD:refs/heads/${{ github.event.repository.default_branch }} || echo "Push skipped"

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${TAG#v}"
          NOTES=$(awk "/^## Version ${VERSION}$/{ found=1; next } found && /^## /{ exit } found{ print }" CHANGELOG.md)
          if [[ -z "$NOTES" ]]; then
            NOTES="No release notes for ${TAG}."
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and create DMG
        run: |
          chmod +x build.sh
          CI=true ./build.sh

      - name: Rename DMG with version
        run: mv clip.dmg "clip-${{ steps.version.outputs.tag }}.dmg"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: "clip-${{ steps.version.outputs.tag }}.dmg"
          name: clip ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          body: |
            ${{ steps.changelog.outputs.notes }}

            ## Installation

            1. Download **clip-${{ steps.version.outputs.tag }}.dmg** below
            2. Open the DMG and drag **clip** to Applications
            3. Since the app is not notarized, macOS may block it on first launch. Run the following command in Terminal:

            ```
            xattr -cr /Applications/clip.app
            ```

            Then open clip normally. On first paste, grant **Accessibility** permission when prompted (System Settings → Privacy & Security → Accessibility).

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
